<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volish | تقييم مستواك في الإنجليزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============ Brand typeface — Volish ============ */
  @font-face {
    font-family: "iStoriaHeavy";
    src: url("./fonts/iStoriaHeavy.eot");
    src:
        url("./fonts/iStoriaHeavy.eot") format("embedded-opentype"),
        url("./fonts/iStoriaHeavy.woff2") format("woff2"),
        url("./fonts/iStoriaHeavy.woff") format("woff"),
        url("./fonts/iStoriaHeavy.ttf") format("truetype"),
        url("./fonts/iStoriaHeavy.svg#iStoriaHeavy") format("svg");
  }
  @font-face {
    font-family: "iStoriaRegular";
    src: url("./fonts/iStoriaRegular.eot");
    src:
        url("./fonts/iStoriaRegular.eot") format("embedded-opentype"),
        url("./fonts/iStoriaRegular.woff2") format("woff2"),
        url("./fonts/iStoriaRegular.woff") format("woff"),
        url("./fonts/iStoriaRegular.ttf") format("truetype"),
        url("./fonts/iStoriaRegular.svg#iStoriaRegular") format("svg");
  }
  @font-face {
    font-family: "iStoriaSemiBold";
    src: url("./fonts/iStoriaSemiBold.eot");
    src:
        url("./fonts/iStoriaSemiBold.eot") format("embedded-opentype"),
        url("./fonts/iStoriaSemiBold.woff2") format("woff2"),
        url("./fonts/iStoriaSemiBold.woff") format("woff"),
        url("./fonts/iStoriaSemiBold.ttf") format("truetype"),
        url("./fonts/iStoriaSemiBold.svg#iStoriaSemiBold") format("svg");
  }
  @font-face {
    font-family: "iStoriaThin";
    src: url("./fonts/iStoriaThin.eot");
    src:
        url("./fonts/iStoriaThin.eot") format("embedded-opentype"),
        url("./fonts/iStoriaThin.woff2") format("woff2"),
        url("./fonts/iStoriaThin.woff") format("woff"),
        url("./fonts/iStoriaThin.ttf") format("truetype"),
        url("./fonts/iStoriaThin.svg#iStoriaThin") format("svg");
  }
  @font-face {
    font-family: "iStoriaBold";
    src: url("./fonts/iStoriaBold.eot");
    src:
        url("./fonts/iStoriaBold.eot") format("embedded-opentype"),
        url("./fonts/iStoriaBold.woff2") format("woff2"),
        url("./fonts/iStoriaBold.woff") format("woff"),
        url("./fonts/iStoriaBold.ttf") format("truetype"),
        url("./fonts/iStoriaBold.svg#iStoriaBold") format("svg");
  }

  :root{
    /* ===== Volish — Quiet Luxury palette ===== */
    --bg-1:#191526;        /* deep plum-ink */
    --bg-2:#221C33;        /* plum */
    --bg-glow:#332B4D;      /* soft violet glow */
    --card:#FAF7F2;         /* warm porcelain */
    --card-tint:#F3EFE8;    /* porcelain tint for insets */
    --card-tint-2:#EDE8DF;  /* deeper porcelain */
    --ink:#282234;          /* near-plum ink */
    --ink-muted:#6E6678;    /* muted ink */
    --gold:#C6A25E;         /* champagne gold */
    --gold-soft:#DFC088;    /* soft champagne */
    --violet:#8B7BC0;       /* calm lavender accent */
    --violet-deep:#6E5EA6;  /* deeper lavender */
    --sage:#89A992;         /* calm sage (positive) */
    --rose:#B57C86;         /* muted dusty rose (attention) */
    --offwhite:#EFEBF3;     /* light text on dark bg */
    --muted-on-dark:#A79FB8;/* muted text on dark bg */
    --line:rgba(239,235,243,0.12);
    --line-warm:#E4DDD1;    /* hairline on porcelain */

    --f-display:'iStoriaHeavy','iStoriaBold','Tajawal',sans-serif;
    --f-heading:'iStoriaBold','iStoriaSemiBold','Tajawal',sans-serif;
    --f-semibold:'iStoriaSemiBold','Tajawal',sans-serif;
    --f-body:'iStoriaRegular','Tajawal',sans-serif;
    --f-thin:'iStoriaThin','Tajawal',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-1);}
  body{
    background:
      radial-gradient(1100px 520px at 82% -8%, var(--bg-glow) 0%, rgba(51,43,77,0) 55%),
      radial-gradient(900px 500px at 10% 8%, #2A2340 0%, rgba(42,35,64,0) 50%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 60%);
    min-height:100vh;
    font-family:var(--f-body);
    color:var(--offwhite);
    display:flex;
    justify-content:center;
    padding:40px 18px 72px;
  }
  .app{width:100%;max-width:640px;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .brand-mark{font-family:var(--f-display);font-size:25px;color:var(--gold-soft);letter-spacing:.01em;direction:ltr;}
  .brand-tag{
    font-family:var(--f-thin);font-size:10.5px;letter-spacing:.16em;color:var(--muted-on-dark);
    text-transform:uppercase;direction:ltr;padding:5px 10px;border:1px solid var(--line);border-radius:99px;
  }

  .eyebrow{
    font-family:var(--f-thin);
    font-size:12.5px;
    letter-spacing:.12em;
    color:var(--gold-soft);
    margin-bottom:8px;
    display:flex;align-items:center;gap:9px;
  }
  .eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 4px rgba(139,123,192,0.2);}
  h1{
    font-family:var(--f-heading);
    font-weight:400;
    font-size:29px;
    margin:0 0 12px;
    color:var(--offwhite);
    line-height:1.4;
    letter-spacing:.005em;
  }
  .sub{font-family:var(--f-body);color:var(--muted-on-dark);font-size:15px;line-height:2;margin:0 0 30px;}
  .card{
    background:var(--card);
    color:var(--ink);
    border-radius:26px;
    padding:32px 26px;
    box-shadow:0 30px 70px -28px rgba(12,8,26,0.7), 0 2px 0 rgba(255,255,255,0.6) inset;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(198,162,94,0.16);
  }
  .card::before{
    content:'';position:absolute;top:0;right:0;left:0;height:3px;
    background:linear-gradient(90deg,var(--sage),var(--gold),var(--violet));
    opacity:.85;
  }

  /* ---------- Intro screen ---------- */
  .feature-list{list-style:none;padding:0;margin:22px 0 28px;display:flex;flex-direction:column;gap:16px;}
  .feature-list li{display:flex;align-items:flex-start;gap:13px;font-family:var(--f-body);font-size:14.5px;line-height:1.8;color:var(--ink-muted);}
  .feature-list .dot{
    flex:none;width:28px;height:28px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--f-semibold);font-size:12px;
    background:var(--card-tint);color:var(--gold);border:1px solid var(--line-warm);margin-top:1px;
  }
  .btn{
    appearance:none;border:none;cursor:pointer;
    font-family:var(--f-semibold);font-size:15.5px;
    padding:16px 22px;border-radius:16px;min-height:52px;
    background:linear-gradient(135deg,var(--gold-soft),var(--gold));
    color:#2A2010;width:100%;
    box-shadow:0 14px 30px -12px rgba(198,162,94,0.6);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 18px 34px -12px rgba(198,162,94,0.7);filter:brightness(1.02);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{
    background:transparent;color:var(--ink);border:1.5px solid var(--line-warm);
    box-shadow:none;font-family:var(--f-body);
  }
  .btn.secondary:hover{background:var(--card-tint);box-shadow:none;filter:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .mic-note{font-family:var(--f-thin);font-size:12.5px;color:var(--ink-muted);text-align:center;margin-top:16px;line-height:1.8;}

  /* ---------- Progress ---------- */
  .progress-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-family:var(--f-thin);font-size:12px;color:var(--muted-on-dark);}
  .progress-bar{height:6px;border-radius:99px;background:rgba(239,235,243,0.12);overflow:hidden;margin-bottom:24px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--gold));transition:width .5s ease;}

  /* ---------- Question card ---------- */
  .qtag{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--f-semibold);font-size:11px;letter-spacing:.05em;
    color:var(--violet-deep);background:rgba(139,123,192,0.12);padding:5px 12px;border-radius:99px;margin-bottom:18px;
  }
  .question-en{
    font-family:var(--f-body);font-size:20px;line-height:1.6;color:var(--ink);
    direction:ltr;text-align:left;margin:0 0 10px;
  }
  .question-ar-wrap{display:flex;align-items:flex-start;gap:8px;margin:0 0 22px;padding-top:14px;border-top:1px dashed var(--line-warm);}
  .ar-badge{
    flex:none;font-family:var(--f-thin);font-size:10.5px;color:var(--gold);
    background:var(--card-tint);border:1px solid var(--line-warm);border-radius:6px;padding:2px 7px;margin-top:3px;
  }
  .question-ar{font-family:var(--f-body);font-size:14.5px;line-height:1.9;color:var(--ink-muted);margin:0;}

  .question-img{width:100%;border-radius:16px;margin-bottom:20px;display:block;object-fit:cover;max-height:250px;}
  .listen-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--card-tint);border:1px solid var(--line-warm);border-radius:12px;padding:10px 15px;
    font-family:var(--f-semibold);font-size:13.5px;color:var(--ink);
    cursor:pointer;margin-bottom:24px;transition:background .15s ease;
  }
  .listen-btn:hover{background:var(--card-tint-2);}
  .listen-btn svg{color:var(--violet-deep);}

  .rec-zone{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;}
  .mic-btn{
    position:relative;width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--gold-soft),var(--gold));
    display:flex;align-items:center;justify-content:center;color:#2A2010;
    box-shadow:0 16px 30px -10px rgba(198,162,94,0.55);
  }
  .mic-btn.recording{background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:#FBF9FF;box-shadow:0 16px 30px -10px rgba(110,94,166,0.6);}
  .mic-btn .ring{
    position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--violet);
    opacity:0;
  }
  .mic-btn.recording .ring{animation:pulse 1.6s ease-out infinite;}
  .mic-btn.recording .ring:nth-child(2){animation-delay:.5s;}
  .mic-btn.recording .ring:nth-child(3){animation-delay:1s;}
  @keyframes pulse{
    0%{opacity:.55;transform:scale(1);}
    100%{opacity:0;transform:scale(1.55);}
  }
  .mic-label{margin-top:16px;font-family:var(--f-body);font-size:13.5px;color:var(--ink-muted);}
  .timer{font-family:var(--f-thin);font-size:13px;color:var(--violet-deep);margin-top:4px;min-height:18px;}

  .live-transcript{
    width:100%;margin-top:20px;min-height:64px;
    background:var(--card-tint);border:1.5px dashed var(--line-warm);border-radius:14px;
    padding:15px;font-family:var(--f-body);font-size:13.5px;
    color:var(--ink);direction:ltr;text-align:left;line-height:1.8;white-space:pre-wrap;
  }
  .live-transcript.empty{color:#A79FB0;}
  .row-btns{display:flex;gap:12px;margin-top:20px;}
  .row-btns .btn{width:auto;flex:1;}
  .warn{
    background:rgba(181,124,134,0.1);border:1px solid rgba(181,124,134,0.35);color:#8C4E5A;
    font-family:var(--f-body);font-size:12.5px;padding:13px 15px;border-radius:12px;margin-bottom:16px;line-height:1.8;
  }

  /* ---------- Loading / results ---------- */
  .loading-wrap{display:flex;flex-direction:column;align-items:center;padding:30px 10px;}
  .spinner{width:54px;height:54px;border-radius:50%;border:4px solid var(--card-tint-2);border-top-color:var(--violet);animation:spin 1s linear infinite;margin-bottom:18px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-wrap p{font-family:var(--f-body);font-size:14px;color:var(--ink-muted);}

  .gauge-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:8px;}
  .gauge{
    width:260px;height:132px;border-radius:130px 130px 4px 4px;position:relative;overflow:hidden;
    background:conic-gradient(from 270deg at 50% 100%,
      #7FA0C4 0deg, #7FA0C4 30deg,
      #89A992 30deg, #89A992 60deg,
      #C9B888 60deg, #C9B888 90deg,
      #C6A25E 90deg, #C6A25E 120deg,
      #A98FC0 120deg, #A98FC0 150deg,
      #6E5EA6 150deg, #6E5EA6 180deg);
  }
  .gauge::after{
    content:'';position:absolute;left:50%;bottom:0;width:190px;height:96px;
    transform:translateX(-50%);background:var(--card);border-radius:100px 100px 0 0;
  }
  .needle{
    position:absolute;left:50%;bottom:0;width:3px;height:96px;background:var(--ink);
    transform-origin:bottom center;border-radius:3px;
    transition:transform 1.1s cubic-bezier(.2,.9,.25,1);
  }
  .needle::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:14px;height:14px;background:var(--ink);border-radius:50%;}
  .gauge-labels{display:flex;justify-content:space-between;width:260px;margin-top:6px;font-family:var(--f-thin);font-size:10.5px;color:var(--ink-muted);padding:0 4px;}
  .level-big{font-family:var(--f-display);font-size:44px;color:var(--ink);margin:12px 0 2px;}
  .level-name{font-family:var(--f-body);font-size:14.5px;color:var(--ink-muted);margin-bottom:24px;}

  .section-title{
    font-family:var(--f-semibold);font-size:13.5px;color:var(--ink);margin:24px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .bar{width:4px;height:14px;border-radius:2px;background:var(--gold);}
  ul.plain{margin:0;padding-right:18px;}
  ul.plain li{font-family:var(--f-body);font-size:14px;line-height:1.9;color:var(--ink-muted);margin-bottom:4px;}
  .summary-box{font-family:var(--f-body);font-size:14.5px;line-height:1.9;color:var(--ink);background:var(--card-tint);border:1px solid var(--line-warm);border-radius:14px;padding:15px 17px;}

  .correction-row{
    display:flex;flex-direction:column;gap:4px;padding:13px 15px;
    background:var(--card-tint);border:1px solid var(--line-warm);border-radius:12px;margin-bottom:8px;
  }
  .correction-row .orig{font-family:var(--f-body);font-size:12.5px;color:var(--rose);direction:ltr;text-align:left;text-decoration:line-through;opacity:.85;}
  .correction-row .fixed{font-family:var(--f-body);font-size:12.5px;color:#4A7D5C;direction:ltr;text-align:left;}

  .footer-note{font-family:var(--f-thin);text-align:center;color:var(--muted-on-dark);font-size:12px;margin-top:24px;line-height:1.9;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const QUESTIONS = [
  {type:'talk', tag:'تعارف', prompt:"Let's start simple. Tell me your name, where you're from, and one thing you enjoy doing in your free time.", prompt_ar:"خلّنا نبدأ بشيء بسيط. قول لي اسمك، من وين انت، وشي وحد تحب تسويه بوقت فراغك."},
  {type:'image', tag:'وصف صورة', prompt:"Look at this picture. Describe what you see — the place, the people, and what might be happening.", prompt_ar:"شوف هذي الصورة. وصف اللي تشوفه — المكان، الأشخاص، وايش ممكن يكون صاير.", img:'https://picsum.photos/seed/market42/800/520'},
  {type:'talk', tag:'روتين يومي', prompt:"What do you usually do on weekends? Do you enjoy it, and why or why not?", prompt_ar:"وش تسوي عادة في نهاية الأسبوع؟ هل تستمتع فيه، وليه أو ليه لا؟"},
  {type:'image', tag:'مقارنة', prompt:"Look at this second picture. How is it similar to or different from your own daily life?", prompt_ar:"شوف هذي الصورة الثانية. كيف تشبه أو تختلف عن حياتك اليومية؟", img:'https://picsum.photos/seed/family77/800/520'},
  {type:'talk', tag:'رأي شخصي', prompt:"If you could change one thing about the city you live in, what would it be, and why?", prompt_ar:"لو تقدر تغيّر شي واحد بالمدينة اللي تعيش فيها، وش بيكون، وليه؟"},
  {type:'talk', tag:'نقاش', prompt:"Some people think technology makes life easier. Others think it makes life more complicated and stressful. What's your opinion?", prompt_ar:"بعض الناس يشوفون إن التقنية تسهّل الحياة، وبعضهم يشوفون إنها تعقّدها وتزيد التوتر. وش رأيك انت؟"},
  {type:'talk', tag:'خبرة شخصية', prompt:"Tell me about a difficult decision you once made. What did you decide, and what did you learn from it?", prompt_ar:"حدثني عن قرار صعب أخذته يوم من الأيام. وش قررت، وش تعلمت منه؟"},
  {type:'talk', tag:'تفكير متقدم', prompt:"Imagine you were responsible for improving education in your country. What would you change first, and why?", prompt_ar:"تخيل انك مسؤول عن تطوير التعليم في بلدك. وش أول شي بتغيّره، وليه؟"}
];

const ICON_MIC = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
const ICON_STOP = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>';
const ICON_SPEAKER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';

let state = {
  screen:'intro',
  qIndex:0,
  answers:[],
  recognitionSupported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
  isRecording:false,
  interim:'',
  finalText:'',
  timerSeconds:0,
  timerHandle:null,
  recognition:null,
  result:null,
  errorMsg:''
};

function renderBrand(){
  return `<div class="brand"><span class="brand-mark">Volish</span><span class="brand-tag">English Speaking Assessment</span></div>`;
}

function render(){
  const app = document.getElementById('app');
  let body = '';
  if(state.screen==='intro') body = renderIntro();
  else if(state.screen==='question') body = renderQuestion();
  else if(state.screen==='loading') body = renderLoading();
  else if(state.screen==='results') body = renderResults();
  else if(state.screen==='error') body = renderErrorScreen();
  app.innerHTML = renderBrand() + body;
  attachHandlers();
}

function renderIntro(){
  return `
    <div class="eyebrow">تقييم صوتي · ٨ أسئلة</div>
    <h1>وش مستواك بالإنجليزي؟</h1>
    <p class="sub">محادثة قصيرة تكتشف مستواك الحقيقي حسب معيار CEFR العالمي (A1 إلى C2) — تسمع الأسئلة وتشوفها مكتوبة بالإنجليزي والعربي، وتجاوب بصوتك.</p>
    <div class="card">
      <ul class="feature-list">
        <li><span class="dot">١</span>ثمانية أسئلة متدرجة الصعوبة — بعضها محادثة، وبعضها وصف صور.</li>
        <li><span class="dot">٢</span>كل سؤال مكتوب ومترجم بالعربي، وتسمعه بصوت إنجليزي أصلي.</li>
        <li><span class="dot">٣</span>تجاوب بالتحدث مباشرة عبر الميكروفون فقط — بدون كتابة.</li>
        <li><span class="dot">٤</span>بالنهاية تحصل على مستواك بالضبط، مع نقاط قوتك وأخطاء تحتاج تصحيح.</li>
      </ul>
      <button class="btn" id="startBtn">ابدأ الاختبار</button>
      <p class="mic-note">${state.recognitionSupported ? 'بيطلب المتصفح صلاحية الميكروفون عند أول تسجيل — وافق حتى تقدر تجاوب صوتيًا.' : 'تنبيه: هذا المتصفح لا يدعم التعرف الصوتي، يُفضّل فتح الموقع من متصفح Chrome على جهاز كمبيوتر أو أندرويد.'}</p>
    </div>
  `;
}

function renderQuestion(){
  const q = QUESTIONS[state.qIndex];
  const total = QUESTIONS.length;
  const pct = Math.round((state.qIndex/total)*100);
  const transcriptText = (state.finalText + (state.interim?(' '+state.interim):'')).trim();
  const canGoNext = transcriptText.length>0 && !state.isRecording;

  return `
    <div class="progress-wrap"><span>السؤال ${state.qIndex+1} من ${total}</span><span>${pct}%</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <span class="qtag">${q.tag}</span>
      ${q.img?`<img class="question-img" src="${q.img}" alt="question visual">`:''}
      <p class="question-en">${q.prompt}</p>
      <div class="question-ar-wrap">
        <span class="ar-badge">AR</span>
        <p class="question-ar">${q.prompt_ar}</p>
      </div>
      <button class="listen-btn" id="listenBtn">${ICON_SPEAKER} استمع للسؤال</button>

      ${state.errorMsg ? `<div class="warn">${state.errorMsg}</div>` : ''}

      ${!state.recognitionSupported ? `
        <div class="warn">التعرف الصوتي غير مدعوم في هذا المتصفح، فما تقدر تجاوب على هذا السؤال هنا. افتح الموقع من متصفح Chrome، أو اضغط "تخطي" للمتابعة.</div>
      ` : `
        <div class="rec-zone">
          <button class="mic-btn ${state.isRecording?'recording':''}" id="micBtn">
            <span class="ring"></span><span class="ring"></span><span class="ring"></span>
            <span style="position:relative;z-index:2;display:flex;">${state.isRecording? ICON_STOP : ICON_MIC}</span>
          </button>
          <div class="mic-label">${state.isRecording? 'اضغط للإيقاف' : (transcriptText? 'اضغط لإعادة التسجيل' : 'اضغط وابدأ الكلام بالإنجليزي')}</div>
          <div class="timer">${state.isRecording? formatTime(state.timerSeconds) : ''}</div>
          <div class="live-transcript ${transcriptText? '' : 'empty'}">${transcriptText || 'سيظهر كلامك مكتوبًا هنا أثناء التسجيل...'}</div>
        </div>
      `}

      <div class="row-btns">
        <button class="btn secondary" id="skipBtn">تخطي</button>
        <button class="btn" id="nextBtn" ${canGoNext? '' : 'disabled'}>${state.qIndex===total-1?'إنهاء وتحليل النتيجة':'التالي'}</button>
      </div>
    </div>
  `;
}

function renderLoading(){
  return `
    <div class="card">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>جارٍ تحليل إجاباتك وتحديد مستواك...</p>
      </div>
    </div>
  `;
}

function renderErrorScreen(){
  return `
    <div class="card">
      <div class="warn">صار خطأ أثناء تحليل النتيجة: ${state.errorMsg}</div>
      <button class="btn" id="retryBtn">حاول مرة ثانية</button>
    </div>
  `;
}

const LEVEL_INDEX = {A1:0,A2:1,B1:2,B2:3,C1:4,C2:5};
const LEVEL_AR = {A1:'مبتدئ',A2:'مبتدئ متقدم',B1:'متوسط',B2:'متوسط متقدم',C1:'متقدم',C2:'محترف'};

function renderResults(){
  const r = state.result;
  const idx = LEVEL_INDEX[r.level] ?? 2;
  const angle = (idx*30+15-90);
  const strengths = (r.strengths_ar||[]).map(s=>`<li>${s}</li>`).join('');
  const weaknesses = (r.weaknesses_ar||[]).map(s=>`<li>${s}</li>`).join('');
  const corrections = (r.corrections||[]).map(c=>`
    <div class="correction-row">
      <div class="orig">${c.original}</div>
      <div class="fixed">✓ ${c.corrected}</div>
    </div>`).join('');

  return `
    <div class="eyebrow">نتيجة التقييم</div>
    <div class="card">
      <div class="gauge-wrap">
        <div class="gauge"><div class="needle" style="transform:rotate(${angle}deg)"></div></div>
        <div class="gauge-labels"><span>A1</span><span>A2</span><span>B1</span><span>B2</span><span>C1</span><span>C2</span></div>
        <div class="level-big">${r.level}</div>
        <div class="level-name">${r.levelName_ar || LEVEL_AR[r.level] || ''}</div>
      </div>

      <div class="summary-box">${r.summary_ar || ''}</div>

      <div class="section-title"><span class="bar"></span>نقاط قوتك</div>
      <ul class="plain">${strengths}</ul>

      <div class="section-title"><span class="bar"></span>تحتاج تشتغل عليها</div>
      <ul class="plain">${weaknesses}</ul>

      ${corrections? `<div class="section-title"><span class="bar"></span>أمثلة من إجاباتك مع التصحيح</div>${corrections}`:''}

      <div class="section-title"><span class="bar"></span>توصية</div>
      <div class="summary-box">${r.recommendation_ar || ''}</div>

      <div class="row-btns" style="margin-top:24px;">
        <button class="btn" id="restartBtn">إعادة الاختبار</button>
      </div>
    </div>
    <p class="footer-note">التقييم تقريبي ويعتمد على محادثة قصيرة — للحصول على تقييم رسمي معتمد يُفضّل اختبار مثل IELTS أو TOEFL.</p>
  `;
}

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function resetQuestionState(){
  state.isRecording = false;
  state.interim = '';
  state.finalText = '';
  state.timerSeconds = 0;
  state.errorMsg = '';
  if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; }
}

function startRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ render(); return; }
  try{
    const rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e)=>{
      let finalChunk = '';
      let interimChunk = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalChunk += t + ' ';
        else interimChunk += t;
      }
      if(finalChunk) state.finalText = (state.finalText + ' ' + finalChunk).trim();
      state.interim = interimChunk;
      render();
    };
    rec.onerror = (e)=>{
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        state.errorMsg = 'تم رفض إذن الميكروفون. فعّل صلاحية الميكروفون للموقع من إعدادات المتصفح وحاول مرة ثانية.';
      } else if(e.error === 'no-speech'){
        // ignore
      } else {
        state.errorMsg = 'صار خطأ بالتسجيل الصوتي (' + e.error + '). جرب مرة ثانية.';
      }
      stopRecordingInternal();
      render();
    };
    rec.onend = ()=>{
      if(state.isRecording){
        state.isRecording = false;
        if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; }
        render();
      }
    };
    state.recognition = rec;
    state.isRecording = true;
    state.timerSeconds = 0;
    state.timerHandle = setInterval(()=>{ state.timerSeconds++; render(); }, 1000);
    rec.start();
    render();
  }catch(err){
    state.errorMsg = 'ما قدرنا نبدأ التسجيل. حاول مرة ثانية.';
    render();
  }
}

function stopRecordingInternal(){
  state.isRecording = false;
  if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; }
  if(state.recognition){
    try{ state.recognition.stop(); }catch(e){}
  }
}

function stopRecording(){
  stopRecordingInternal();
  render();
}

function attachHandlers(){
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = ()=>{
    state.screen = 'question';
    state.qIndex = 0;
    resetQuestionState();
    render();
    speak(QUESTIONS[0].prompt);
  };

  const listenBtn = document.getElementById('listenBtn');
  if(listenBtn) listenBtn.onclick = ()=> speak(QUESTIONS[state.qIndex].prompt);

  const micBtn = document.getElementById('micBtn');
  if(micBtn) micBtn.onclick = ()=>{
    if(state.isRecording){ stopRecording(); }
    else {
      state.finalText=''; state.interim=''; state.errorMsg='';
      startRecording();
    }
  };

  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.onclick = ()=> advance('(no answer given)');

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = ()=>{
    const answer = (state.finalText||'').trim() || '(no answer given)';
    advance(answer);
  };

  const restartBtn = document.getElementById('restartBtn');
  if(restartBtn) restartBtn.onclick = ()=>{
    state = {...state, screen:'intro', qIndex:0, answers:[], result:null, errorMsg:''};
    render();
  };

  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.onclick = ()=>{ state.screen='loading'; render(); runEvaluation(); };
}

function advance(answer){
  const q = QUESTIONS[state.qIndex];
  state.answers.push({prompt:q.prompt, type:q.type, answer});
  window.speechSynthesis && window.speechSynthesis.cancel();
  stopRecordingInternal();

  if(state.qIndex < QUESTIONS.length-1){
    state.qIndex++;
    resetQuestionState();
    render();
    speak(QUESTIONS[state.qIndex].prompt);
  } else {
    state.screen = 'loading';
    render();
    runEvaluation();
  }
}

async function runEvaluation(){
  try{
    const conversation = state.answers.map((a,i)=>`Q${i+1} [${a.type}]: ${a.prompt}\nStudent answer: ${a.answer}`).join('\n\n');

    const resp = await fetch('/api/evaluate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ conversation })
    });
    const parsed = await resp.json();
    if(!resp.ok){
      throw new Error(parsed.error || 'Server error while evaluating your answers.');
    }
    state.result = parsed;
    state.screen = 'results';
    render();
  }catch(err){
    state.errorMsg = (err && err.message) ? err.message : 'خطأ غير معروف';
    state.screen = 'error';
    render();
  }
}

render();
</script>
</body>
</html>
