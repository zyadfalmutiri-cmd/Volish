<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volish | تقييم مستواك في الإنجليزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0D1F2C;
    --bg-2:#132A3A;
    --card:#FDFBF6;
    --ink:#1F2A33;
    --ink-muted:#5B6B73;
    --gold:#D4A144;
    --gold-soft:#E9C275;
    --coral:#E8604C;
    --sage:#7FA98A;
    --offwhite:#F2EEE6;
    --line:rgba(242,238,230,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 20% -10%, #1B3A4E 0%, var(--bg-2) 45%, var(--bg-1) 100%);
    min-height:100vh;
    font-family:'Tajawal',sans-serif;
    color:var(--offwhite);
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{width:100%;max-width:640px;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;}
  .brand-mark{font-family:'Lora',serif;font-weight:600;font-style:italic;font-size:22px;color:var(--gold-soft);letter-spacing:.01em;direction:ltr;}
  .brand-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:#7C8A90;text-transform:uppercase;direction:ltr;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--gold-soft);
    text-transform:uppercase;
    margin-bottom:6px;
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(232,96,76,0.18);}
  h1{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 8px;
    color:var(--offwhite);
  }
  .sub{color:#B9C4C9;font-size:15px;line-height:1.9;margin:0 0 28px;}
  .card{
    background:var(--card);
    color:var(--ink);
    border-radius:20px;
    padding:28px 24px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.55);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;right:0;left:0;height:5px;
    background:linear-gradient(90deg,var(--sage),var(--gold),var(--coral));
  }

  /* ---------- Intro screen ---------- */
  .feature-list{list-style:none;padding:0;margin:20px 0 26px;display:flex;flex-direction:column;gap:14px;}
  .feature-list li{display:flex;align-items:flex-start;gap:12px;font-size:14.5px;line-height:1.7;color:var(--ink-muted);}
  .feature-list .dot{
    flex:none;width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;
    background:#EFE9DC;color:var(--ink);margin-top:1px;
  }
  .btn{
    appearance:none;border:none;cursor:pointer;
    font-family:'Tajawal',sans-serif;font-weight:700;font-size:15.5px;
    padding:15px 22px;border-radius:14px;
    background:linear-gradient(135deg,var(--gold),var(--coral));
    color:#241408;width:100%;
    box-shadow:0 10px 24px -8px rgba(232,96,76,0.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -8px rgba(232,96,76,0.6);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{
    background:transparent;color:var(--ink);border:1.5px solid #DED5C2;
    box-shadow:none;font-weight:500;
  }
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  .mic-note{font-size:12.5px;color:var(--ink-muted);text-align:center;margin-top:12px;line-height:1.7;}

  /* ---------- Progress ---------- */
  .progress-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#9BAAB1;}
  .progress-bar{height:6px;border-radius:99px;background:rgba(242,238,230,0.12);overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));transition:width .5s ease;}

  /* ---------- Question card ---------- */
  .qtag{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;
    color:#8C7B4E;background:#F3ECD9;padding:4px 10px;border-radius:99px;margin-bottom:16px;
  }
  .question-en{
    font-family:'Lora',serif;font-size:21px;line-height:1.55;color:var(--ink);
    direction:ltr;text-align:left;margin:0 0 18px;
  }
  .question-img{width:100%;border-radius:14px;margin-bottom:18px;display:block;object-fit:cover;max-height:260px;}
  .listen-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:#EFE9DC;border:none;border-radius:10px;padding:9px 14px;
    font-family:'Tajawal',sans-serif;font-size:13.5px;font-weight:700;color:var(--ink);
    cursor:pointer;margin-bottom:22px;
  }
  .listen-btn:hover{background:#E7DFCC;}

  .rec-zone{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;}
  .mic-btn{
    position:relative;width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),var(--coral));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 26px -8px rgba(232,96,76,0.5);
  }
  .mic-btn.recording{background:linear-gradient(135deg,var(--coral),#B93E2F);}
  .mic-btn .ring{
    position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--coral);
    opacity:0;
  }
  .mic-btn.recording .ring{animation:pulse 1.6s ease-out infinite;}
  .mic-btn.recording .ring:nth-child(2){animation-delay:.5s;}
  .mic-btn.recording .ring:nth-child(3){animation-delay:1s;}
  @keyframes pulse{
    0%{opacity:.55;transform:scale(1);}
    100%{opacity:0;transform:scale(1.55);}
  }
  .mic-label{margin-top:14px;font-size:13.5px;color:var(--ink-muted);font-weight:500;}
  .timer{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--coral);margin-top:4px;min-height:18px;}

  .live-transcript{
    width:100%;margin-top:18px;min-height:64px;
    background:#F7F3EA;border:1.5px dashed #DED5C2;border-radius:12px;
    padding:14px;font-family:'JetBrains Mono',monospace;font-size:13.5px;
    color:var(--ink);direction:ltr;text-align:left;line-height:1.7;white-space:pre-wrap;
  }
  .live-transcript.empty{color:#A8A196;font-style:italic;}
  textarea.answer-edit{
    width:100%;min-height:100px;margin-top:14px;
    background:#F7F3EA;border:1.5px solid #DED5C2;border-radius:12px;
    padding:14px;font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--ink);
    direction:ltr;text-align:left;line-height:1.7;resize:vertical;
  }
  .row-btns{display:flex;gap:10px;margin-top:18px;}
  .row-btns .btn{width:auto;flex:1;}
  .toggle-type{
    background:none;border:none;text-decoration:underline;
    font-family:'Tajawal',sans-serif;font-size:12.5px;color:var(--ink-muted);
    cursor:pointer;margin-top:14px;
  }
  .warn{
    background:#FBEFE8;border:1px solid #EAD2C2;color:#8A4E2E;
    font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:16px;line-height:1.7;
  }

  /* ---------- Loading / results ---------- */
  .loading-wrap{display:flex;flex-direction:column;align-items:center;padding:30px 10px;}
  .spinner{width:54px;height:54px;border-radius:50%;border:4px solid #EFE9DC;border-top-color:var(--coral);animation:spin 1s linear infinite;margin-bottom:18px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-wrap p{font-size:14px;color:var(--ink-muted);}

  .gauge-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:8px;}
  .gauge{
    width:260px;height:132px;border-radius:130px 130px 4px 4px;position:relative;overflow:hidden;
    background:conic-gradient(from 270deg at 50% 100%,
      #6E9FB0 0deg, #6E9FB0 30deg,
      #7FA98A 30deg, #7FA98A 60deg,
      #C9B25A 60deg, #C9B25A 90deg,
      #D4A144 90deg, #D4A144 120deg,
      #DE7B4B 120deg, #DE7B4B 150deg,
      #E8604C 150deg, #E8604C 180deg);
  }
  .gauge::after{
    content:'';position:absolute;left:50%;bottom:0;width:190px;height:96px;
    transform:translateX(-50%);background:var(--card);border-radius:100px 100px 0 0;
  }
  .needle{
    position:absolute;left:50%;bottom:0;width:3px;height:96px;background:var(--ink);
    transform-origin:bottom center;border-radius:3px;
    transition:transform 1.1s cubic-bezier(.2,.9,.25,1);
  }
  .needle::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:14px;height:14px;background:var(--ink);border-radius:50%;}
  .gauge-labels{display:flex;justify-content:space-between;width:260px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-muted);padding:0 4px;}
  .level-big{font-family:'Lora',serif;font-size:44px;font-weight:600;color:var(--ink);margin:10px 0 2px;}
  .level-name{font-size:14.5px;color:var(--ink-muted);margin-bottom:22px;}

  .section-title{
    font-size:13.5px;font-weight:700;color:var(--ink);margin:22px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .bar{width:4px;height:14px;border-radius:2px;background:var(--gold);}
  ul.plain{margin:0;padding-right:18px;}
  ul.plain li{font-size:14px;line-height:1.85;color:var(--ink-muted);margin-bottom:4px;}
  .summary-box{font-size:14.5px;line-height:1.9;color:var(--ink);background:#F7F3EA;border-radius:12px;padding:14px 16px;}

  .correction-row{
    display:flex;flex-direction:column;gap:4px;padding:12px 14px;
    background:#F7F3EA;border-radius:10px;margin-bottom:8px;
  }
  .correction-row .orig{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#B24A3B;direction:ltr;text-align:left;text-decoration:line-through;opacity:.8;}
  .correction-row .fixed{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#3E7A52;direction:ltr;text-align:left;}

  .footer-note{text-align:center;color:#7C8A90;font-size:12px;margin-top:22px;line-height:1.8;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const QUESTIONS = [
  {type:'talk', tag:'تعارف', prompt:"Let's start simple. Tell me your name, where you're from, and one thing you enjoy doing in your free time."},
  {type:'image', tag:'وصف صورة', prompt:"Look at this picture. Describe what you see — the place, the people, and what might be happening.", img:'https://picsum.photos/seed/market42/800/520'},
  {type:'talk', tag:'روتين يومي', prompt:"What do you usually do on weekends? Do you enjoy it, and why or why not?"},
  {type:'image', tag:'مقارنة', prompt:"Look at this second picture. How is it similar to or different from your own daily life?", img:'https://picsum.photos/seed/family77/800/520'},
  {type:'talk', tag:'رأي شخصي', prompt:"If you could change one thing about the city you live in, what would it be, and why?"},
  {type:'talk', tag:'نقاش', prompt:"Some people think technology makes life easier. Others think it makes life more complicated and stressful. What's your opinion?"},
  {type:'talk', tag:'خبرة شخصية', prompt:"Tell me about a difficult decision you once made. What did you decide, and what did you learn from it?"},
  {type:'talk', tag:'تفكير متقدم', prompt:"Imagine you were responsible for improving education in your country. What would you change first, and why?"}
];

let state = {
  screen:'intro', // intro | question | loading | results | error
  qIndex:0,
  answers:[], // {prompt, type, answer}
  recognitionSupported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
  isRecording:false,
  interim:'',
  finalText:'',
  typedMode:false,
  timerSeconds:0,
  timerHandle:null,
  recognition:null,
  result:null,
  errorMsg:''
};

function renderBrand(){
  return `<div class="brand"><span class="brand-mark">Volish</span><span class="brand-tag">English Speaking Assessment</span></div>`;
}

function render(){
  const app = document.getElementById('app');
  let body = '';
  if(state.screen==='intro') body = renderIntro();
  else if(state.screen==='question') body = renderQuestion();
  else if(state.screen==='loading') body = renderLoading();
  else if(state.screen==='results') body = renderResults();
  else if(state.screen==='error') body = renderErrorScreen();
  app.innerHTML = renderBrand() + body;
  attachHandlers();
}

function renderIntro(){
  return `
    <div class="eyebrow">تقييم صوتي · ٨ أسئلة</div>
    <h1>وش مستواك بالإنجليزي؟</h1>
    <p class="sub">محادثة قصيرة تكتشف مستواك الحقيقي حسب معيار CEFR العالمي (A1 إلى C2) — تسمع الأسئلة وتشوفها مكتوبة، وتجاوب بصوتك.</p>
    <div class="card">
      <ul class="feature-list">
        <li><span class="dot">١</span>ثمانية أسئلة متدرجة الصعوبة — بعضها محادثة، وبعضها وصف صور.</li>
        <li><span class="dot">٢</span>تسمع كل سؤال بصوت، وتقدر تعيد الاستماع أي وقت.</li>
        <li><span class="dot">٣</span>تجاوب بالتحدث مباشرة عبر الميكروفون (أو بالكتابة إذا حبيت).</li>
        <li><span class="dot">٤</span>بالنهاية تحصل على مستواك بالضبط، مع نقاط قوتك وأخطاء تحتاج تصحيح.</li>
      </ul>
      <button class="btn" id="startBtn">ابدأ الاختبار</button>
      <p class="mic-note">${state.recognitionSupported ? 'بيطلب المتصفح صلاحية الميكروفون عند أول تسجيل — وافق حتى تقدر تجاوب صوتيًا.' : 'ملاحظة: التعرف الصوتي غير مدعوم في هذا المتصفح حاليًا، بس تقدر تكتب إجاباتك بدلاً من التسجيل.'}</p>
    </div>
  `;
}

function renderQuestion(){
  const q = QUESTIONS[state.qIndex];
  const total = QUESTIONS.length;
  const pct = Math.round((state.qIndex/total)*100);
  const transcriptText = (state.finalText + (state.interim?(' '+state.interim):'')).trim();
  const canGoNext = state.typedMode ? (transcriptText.length>0) : (transcriptText.length>0 && !state.isRecording);

  return `
    <div class="progress-wrap"><span>السؤال ${state.qIndex+1} من ${total}</span><span>${pct}%</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <span class="qtag">${q.tag}</span>
      ${q.img?`<img class="question-img" src="${q.img}" alt="question visual">`:''}
      <p class="question-en">${q.prompt}</p>
      <button class="listen-btn" id="listenBtn">🔊 استمع للسؤال</button>

      ${!state.recognitionSupported && !state.typedMode ? `<div class="warn">التعرف الصوتي غير متاح هنا — التبديل تلقائيًا لوضع الكتابة.</div>` : ''}
      ${state.errorMsg ? `<div class="warn">${state.errorMsg}</div>` : ''}

      ${state.typedMode || !state.recognitionSupported ? `
        <textarea class="answer-edit" id="typedAnswer" placeholder="اكتب إجابتك بالإنجليزي هنا...">${state.finalText}</textarea>
      ` : `
        <div class="rec-zone">
          <button class="mic-btn ${state.isRecording?'recording':''}" id="micBtn">
            <span class="ring"></span><span class="ring"></span><span class="ring"></span>
            <span style="font-size:30px;position:relative;z-index:2;">${state.isRecording? '⏹️' : '🎙️'}</span>
          </button>
          <div class="mic-label">${state.isRecording? 'اضغط للإيقاف' : (transcriptText? 'اضغط لإعادة التسجيل' : 'اضغط وابدأ الكلام بالإنجليزي')}</div>
          <div class="timer">${state.isRecording? formatTime(state.timerSeconds) : ''}</div>
          <div class="live-transcript ${transcriptText? '' : 'empty'}">${transcriptText || 'سيظهر كلامك مكتوبًا هنا أثناء التسجيل...'}</div>
        </div>
        <button class="toggle-type" id="toggleType">تفضل تكتب إجابتك بدل التسجيل؟</button>
      `}

      <div class="row-btns">
        <button class="btn secondary" id="skipBtn">تخطي</button>
        <button class="btn" id="nextBtn" ${canGoNext? '' : 'disabled'}>${state.qIndex===total-1?'إنهاء وتحليل النتيجة':'التالي'}</button>
      </div>
    </div>
  `;
}

function renderLoading(){
  return `
    <div class="card">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>جارٍ تحليل إجاباتك وتحديد مستواك...</p>
      </div>
    </div>
  `;
}

function renderErrorScreen(){
  return `
    <div class="card">
      <div class="warn">صار خطأ أثناء تحليل النتيجة: ${state.errorMsg}</div>
      <button class="btn" id="retryBtn">حاول مرة ثانية</button>
    </div>
  `;
}

const LEVEL_INDEX = {A1:0,A2:1,B1:2,B2:3,C1:4,C2:5};
const LEVEL_AR = {A1:'مبتدئ',A2:'مبتدئ متقدم',B1:'متوسط',B2:'متوسط متقدم',C1:'متقدم',C2:'محترف'};

function renderResults(){
  const r = state.result;
  const idx = LEVEL_INDEX[r.level] ?? 2;
  const angle = (idx*30+15-90);
  const strengths = (r.strengths_ar||[]).map(s=>`<li>${s}</li>`).join('');
  const weaknesses = (r.weaknesses_ar||[]).map(s=>`<li>${s}</li>`).join('');
  const corrections = (r.corrections||[]).map(c=>`
    <div class="correction-row">
      <div class="orig">${c.original}</div>
      <div class="fixed">✓ ${c.corrected}</div>
    </div>`).join('');

  return `
    <div class="eyebrow">نتيجة التقييم</div>
    <div class="card">
      <div class="gauge-wrap">
        <div class="gauge"><div class="needle" style="transform:rotate(${angle}deg)"></div></div>
        <div class="gauge-labels"><span>A1</span><span>A2</span><span>B1</span><span>B2</span><span>C1</span><span>C2</span></div>
        <div class="level-big">${r.level}</div>
        <div class="level-name">${r.levelName_ar || LEVEL_AR[r.level] || ''}</div>
      </div>

      <div class="summary-box">${r.summary_ar || ''}</div>

      <div class="section-title"><span class="bar"></span>نقاط قوتك</div>
      <ul class="plain">${strengths}</ul>

      <div class="section-title"><span class="bar"></span>تحتاج تشتغل عليها</div>
      <ul class="plain">${weaknesses}</ul>

      ${corrections? `<div class="section-title"><span class="bar"></span>أمثلة من إجاباتك مع التصحيح</div>${corrections}`:''}

      <div class="section-title"><span class="bar"></span>توصية</div>
      <div class="summary-box">${r.recommendation_ar || ''}</div>

      <div class="row-btns" style="margin-top:24px;">
        <button class="btn" id="restartBtn">إعادة الاختبار</button>
      </div>
    </div>
    <p class="footer-note">التقييم تقريبي ويعتمد على محادثة قصيرة — للحصول على تقييم رسمي معتمد يُفضّل اختبار مثل IELTS أو TOEFL.</p>
  `;
}

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function resetQuestionState(){
  state.isRecording = false;
  state.interim = '';
  state.finalText = '';
  state.typedMode = !state.recognitionSupported;
  state.timerSeconds = 0;
  state.errorMsg = '';
  if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; }
}

function startRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ state.typedMode = true; render(); return; }
  try{
    const rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e)=>{
      let finalChunk = '';
      let interimChunk = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalChunk += t + ' ';
        else interimChunk += t;
      }
      if(finalChunk) state.finalText = (state.finalText + ' ' + finalChunk).trim();
      state.interim = interimChunk;
      render();
    };
    rec.onerror = (e)=>{
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        state.errorMsg = 'تم رفض إذن الميكروفون. تقدر تكتب إجابتك بدل التسجيل.';
        state.typedMode = true;
      } else if(e.error === 'no-speech'){
        // ignore, let it continue or user stops manually
      } else {
        state.errorMsg = 'صار خطأ بالتسجيل الصوتي (' + e.error + '). جرب مرة ثانية أو اكتب إجابتك.';
      }
      stopRecordingInternal();
      render();
    };
    rec.onend = ()=>{
      if(state.isRecording){
        // browser auto-stopped; reflect state
        state.isRecording = false;
        if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; }
        render();
      }
    };
    state.recognition = rec;
    state.isRecording = true;
    state.timerSeconds = 0;
    state.timerHandle = setInterval(()=>{ state.timerSeconds++; render(); }, 1000);
    rec.start();
    render();
  }catch(err){
    state.errorMsg = 'ما قدرنا نبدأ التسجيل. تقدر تكتب إجابتك بدل ذلك.';
    state.typedMode = true;
    render();
  }
}

function stopRecordingInternal(){
  state.isRecording = false;
  if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; }
  if(state.recognition){
    try{ state.recognition.stop(); }catch(e){}
  }
}

function stopRecording(){
  stopRecordingInternal();
  render();
}

function attachHandlers(){
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = ()=>{
    state.screen = 'question';
    state.qIndex = 0;
    resetQuestionState();
    render();
    speak(QUESTIONS[0].prompt);
  };

  const listenBtn = document.getElementById('listenBtn');
  if(listenBtn) listenBtn.onclick = ()=> speak(QUESTIONS[state.qIndex].prompt);

  const micBtn = document.getElementById('micBtn');
  if(micBtn) micBtn.onclick = ()=>{
    if(state.isRecording){ stopRecording(); }
    else {
      state.finalText=''; state.interim=''; state.errorMsg='';
      startRecording();
    }
  };

  const toggleType = document.getElementById('toggleType');
  if(toggleType) toggleType.onclick = ()=>{
    if(state.isRecording) stopRecordingInternal();
    state.typedMode = true;
    render();
  };

  const typedAnswer = document.getElementById('typedAnswer');
  if(typedAnswer) typedAnswer.oninput = (e)=>{
    state.finalText = e.target.value;
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.disabled = state.finalText.trim().length===0;
  };

  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.onclick = ()=> advance('(no answer given)');

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = ()=>{
    const q = QUESTIONS[state.qIndex];
    const answer = (state.finalText||'').trim() || '(no answer given)';
    advance(answer);
  };

  const restartBtn = document.getElementById('restartBtn');
  if(restartBtn) restartBtn.onclick = ()=>{
    state = {...state, screen:'intro', qIndex:0, answers:[], result:null, errorMsg:''};
    render();
  };

  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.onclick = ()=>{ state.screen='loading'; render(); runEvaluation(); };
}

function advance(answer){
  const q = QUESTIONS[state.qIndex];
  state.answers.push({prompt:q.prompt, type:q.type, answer});
  window.speechSynthesis && window.speechSynthesis.cancel();
  stopRecordingInternal();

  if(state.qIndex < QUESTIONS.length-1){
    state.qIndex++;
    resetQuestionState();
    render();
    speak(QUESTIONS[state.qIndex].prompt);
  } else {
    state.screen = 'loading';
    render();
    runEvaluation();
  }
}

async function runEvaluation(){
  try{
    const conversation = state.answers.map((a,i)=>`Q${i+1} [${a.type}]: ${a.prompt}\nStudent answer: ${a.answer}`).join('\n\n');

    const resp = await fetch('/api/evaluate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ conversation })
    });
    const parsed = await resp.json();
    if(!resp.ok){
      throw new Error(parsed.error || 'Server error while evaluating your answers.');
    }
    state.result = parsed;
    state.screen = 'results';
    render();
  }catch(err){
    state.errorMsg = (err && err.message) ? err.message : 'خطأ غير معروف';
    state.screen = 'error';
    render();
  }
}

render();
</script>

</html>
